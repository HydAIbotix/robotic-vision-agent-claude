[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotic-vision-agent"
version = "0.1.0"
description = "LangGraph vision agent for robotic kiosk test automation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "pydantic-settings>=2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",  # FastAPI Form/File parsing (the /api/test-cases/upload route)
    "sqlalchemy>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Install when deploying to AWS: pip install -e ".[aws]"
aws = [
    "boto3>=1.34",
    "langchain-aws>=0.2",
]
# Cloud-agnostic deployment (Postgres + Redis + any S3-compatible store).
# Install with:  pip install -e ".[cloud]"   (Docker image uses ".[cloud,playwright]")
# boto3 is the S3 client and drives MinIO/GCS/Azure-via-S3 as well as real AWS S3.
cloud = [
    "psycopg[binary]>=3.1",   # PostgreSQL driver (postgresql+psycopg://...)
    "redis>=5.0",             # event-bus pub/sub + task queue (realtime + API/worker split)
    "boto3>=1.34",            # S3-compatible object store client
    "pyjwt>=2.8",             # JWT-claim tenant resolution (optional; header works without it)
]
# Optional durable orchestration (Temporal). ORCHESTRATOR_BACKEND=temporal
temporal = [
    "temporalio>=1.6",
]
# Optional vendor-neutral tracing. TRACING_BACKEND=otel|langfuse
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "langfuse>=2.0",
]
# Optional semantic memory. MEMORY_BACKEND=chroma|pgvector
memory = [
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1",
    "langchain-postgres>=0.0.12",
]
playwright = [
    "playwright>=1.40",
]
# Auto-Repair agent's RAG retrieval (Chroma + HuggingFace over the codebase/docs). These back the
# imports in repair_agent/parse_code_and_store.py (langchain_community HuggingFaceEmbeddings + Chroma,
# tree-sitter chunking). Historically installed in dev but never declared, so a clean image failed
# auto-repair with "No module named 'langchain_community'". sentence-transformers pulls torch (large).
repair = [
    "langchain-community>=0.3",   # HuggingFaceEmbeddings + Chroma wrappers used by the RAG index
    "chromadb>=0.5",              # the vector store backing Chroma(persist_directory=...)
    "sentence-transformers>=2.2", # all-MiniLM-L6-v2 embeddings (pulls torch)
    "tree-sitter>=0.22",          # code-aware chunking (falls back to text chunking if unavailable)
    "tree-sitter-typescript>=0.22",
]
# Optional LOCAL auto-repair retrieval: graph-RAG over Neo4j (data-sovereignty backup option).
# Selected with REPAIR_RETRIEVAL_BACKEND=graphrag; imported lazily in repair_agent/graphrag_store.py,
# so installing this changes nothing until the graphrag backend is actually chosen. Reuses the
# HuggingFace embeddings from the [repair] extra (kept local — no code leaves the box). Pair with
# REPAIR_LLM_BACKEND=local (Ollama, e.g. llama3.2:3b) for a fully in-environment repair.
graphrag = [
    "langchain-neo4j>=0.1",       # Neo4jVector (vector index) + Neo4jGraph over the code graph
    "neo4j>=5.14",                # Neo4j Python driver
]
dev = [
    "pytest>=8.0",
    "rich>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vision_agent"]
