[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotic-vision-agent"
version = "0.1.0"
description = "LangGraph vision agent for robotic kiosk test automation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "pydantic-settings>=2.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install when deploying to AWS: pip install -e ".[aws]"
aws = [
    "boto3>=1.34",
    "langchain-aws>=0.2",
]
dev = [
    "pytest>=8.0",
    "rich>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vision_agent"]
