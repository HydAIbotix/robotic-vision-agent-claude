# Worker replicas — the heavy agent work (Explorer / Executor with Chromium + OpenCV, Planner,
# Defect, Repair). Split from the API tier so exploration/execution load scales INDEPENDENTLY of
# HTTP traffic — the agnostic analogue of AWS AgentCore Runtime / fan-out Executors.
#
# SERVICE_ROLE=worker makes the shared image run `python -m worker` (the run-job consumer) instead
# of the API. Requires TASK_QUEUE_BACKEND=redis so the API enqueues and these consume; live events
# still reach clients via the Redis event bus. Give it more memory (Chromium); no public Service.
# Set replicas to 0 to disable the tier (then the API runs suites in-process).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kioskqa-worker
  namespace: kioskqa
spec:
  replicas: 2
  selector:
    matchLabels: { app: kioskqa, role: worker }
  template:
    metadata:
      labels: { app: kioskqa, role: worker }
    spec:
      containers:
        - name: worker
          image: REGISTRY/kioskqa:latest
          env:
            - { name: SERVICE_ROLE, value: "worker" }
          envFrom:
            - configMapRef: { name: kioskqa-config }
            - secretRef:    { name: kioskqa-secrets }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }     # Chromium + OpenCV are memory-hungry
            limits:   { cpu: "2",    memory: "3Gi" }
