# Secrets (credentials only). COPY to secret.yaml, fill real values, and DO NOT commit that copy.
# In production prefer a managed secret store (Azure Key Vault / GCP Secret Manager / AWS Secrets
# Manager, or HashiCorp Vault) surfaced via CSI or External Secrets — the app just reads env.
apiVersion: v1
kind: Secret
metadata:
  name: kioskqa-secrets
  namespace: kioskqa
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"     # Claude API key (never commit the real one)
  S3_ACCESS_KEY_ID: "minioadmin"             # blank on AWS to use the pod's IAM role / workload identity
  S3_SECRET_ACCESS_KEY: "minioadmin"
