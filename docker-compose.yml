# Cloud-agnostic local/prod stack (branch: cloud-agnostic-agent).
#
# Brings up the WHOLE agnostic topology on any Docker host — the exact managed-AWS equivalents,
# self-hosted and portable:
#   postgres  ↔ DynamoDB / RDS      (relational metadata)
#   minio     ↔ S3                  (blob / object store, S3-compatible API)
#   redis     ↔ API-GW WS + Streams (realtime event bus, cross-replica fan-out)
#   app       ↔ AgentCore Runtime + API-GW + Lambda (the FastAPI backend + agents, in-process)
#
# Run:  docker compose up --build
# The identical image + env also deploys to Kubernetes (see deploy/k8s/). Claude is unchanged —
# set ANTHROPIC_API_KEY in a .env file next to this compose file (VISION_BACKEND=anthropic).
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# LAUNCH PARAMETERS — the env vars you set before `./start-all.sh` (or a plain `docker compose up`)
# ──────────────────────────────────────────────────────────────────────────────────────────────
# Example (this VM — REAL Microsoft GraphRAG + Qwen-14B on the GPU):
#     GPU=1 LOCAL_REPAIR=msgraphrag REPAIR_LOCAL_MODEL=qwen2.5-coder:14b ./start-all.sh
#
# A) start-all.sh flags — consumed by the LAUNCH SCRIPT (not by compose directly; see start-all.sh):
#     GPU=1                Run Ollama on the host NVIDIA GPU by layering docker-compose.gpu.yml. Needs the
#                          NVIDIA driver + nvidia-container-toolkit on the host. Omit / GPU=0 = CPU only.
#     LOCAL_REPAIR=<mode>  Which Auto-Repair stack to bring up (also starts neo4j + ollama, and EXPORTS
#                          the REPAIR_*/GRAPHRAG_* vars in (B) so the app switches with NO file edits):
#                            0 / unset  → Chroma + Claude          (default; no extra services)
#                            graphrag   → Neo4j graph-RAG + local Llama via Ollama          [alias: 1]
#                            msgraphrag → REAL Microsoft GraphRAG + a Qwen coder via Ollama  [alias: 2]
#     PULL=1               git pull backend + POS (+ studio) before building.
#     POS_DIR / STUDIO_DIR Override the sibling repo locations (defaults ~/robotics-kiosk-pos, ~/kiosk-test-studio).
#
# B) App env vars — read by THIS compose file as ${VAR:-default} on the `app` service. start-all sets
#    them per LOCAL_REPAIR mode; you can also set any of them yourself for a plain `docker compose up`:
#     REPAIR_RETRIEVAL_BACKEND  chroma | graphrag | msgraphrag   — HOW the offending code/spec is retrieved
#     REPAIR_LLM_BACKEND        claude | local                   — WHICH model diagnoses (and, for
#                                                                   msgraphrag, BUILDS the graph)
#     REPAIR_LOCAL_MODEL        Ollama model for the local path, e.g. qwen2.5-coder:14b (msgraphrag),
#                               llama3.2:3b (graphrag CPU demo). One model does graph-build AND fix.
#     REPAIR_LOCAL_ONLY         true = air-gap (never fall back to Claude — nothing leaves the box)
#     INSTALL_MSGRAPHRAG        true = bake the (heavy) Microsoft GraphRAG deps into the image at build
#     GRAPHRAG_* / NEO4J_*      Microsoft-GraphRAG + Neo4j knobs — see the `app` environment: block below
#    Full switch/revert recipes for each stack are in that block (search "Auto-Repair RETRIEVAL + LLM").
#
# Equivalent of the example WITHOUT start-all.sh (what the flags above expand to):
#     INSTALL_MSGRAPHRAG=true REPAIR_RETRIEVAL_BACKEND=msgraphrag REPAIR_LLM_BACKEND=local \
#       REPAIR_LOCAL_ONLY=true REPAIR_LOCAL_MODEL=qwen2.5-coder:14b COMPOSE_PROFILES=local-repair \
#       docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# ──────────────────────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kioskqa
      POSTGRES_PASSWORD: kioskqa
      POSTGRES_DB: kioskqa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kioskqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 = S3 API, 9001 = web console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket the app expects, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kioskqa &&
      echo 'bucket ready';
      "

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        # Bake the heavy Microsoft GraphRAG deps only when asked (LOCAL_REPAIR=msgraphrag sets this).
        # Default false → image unchanged. Requires `docker compose up --build` to take effect.
        INSTALL_MSGRAPHRAG: "${INSTALL_MSGRAPHRAG:-false}"
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports: ["8001:8001", "6080:6080"]   # 8001 = API; 6080 = live-browser viewer (noVNC, ENABLE_VNC)
    environment:
      # --- Claude (unchanged; API key from .env) ---
      VISION_BACKEND: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Robot backend → Playwright (live Chromium for exploration + test runs) ---
      ROBOT_BACKEND: playwright
      # Live-browser viewer: ENABLE_VNC=true starts a virtual display + noVNC so you can WATCH the
      # browser at http://<EXTERNAL_IP>:6080/vnc.html during exploration + execution. It forces
      # headed Chromium. For the lightweight headless mode (no viewer), set ENABLE_VNC=false and
      # PLAYWRIGHT_HEADLESS=true.
      ENABLE_VNC: "true"
      PLAYWRIGHT_HEADLESS: "false"       # headed → renders onto the Xvfb display the viewer streams
      # --- Persistence → Postgres ---
      PERSISTENCE_BACKEND: postgres
      DB_URL: postgresql+psycopg://kioskqa:kioskqa@postgres:5432/kioskqa
      # --- Object store → LOCAL filesystem (in-container), NOT MinIO/S3. Why: the vision/explorer
      # path captures screenshots to the LOCAL fs (Playwright) then reads them back via
      # get_storage().load(); on an S3 backend that load looks in the bucket for a key that was
      # never uploaded → NoSuchKey (exploration dies in explore_screen). local = MVP-identical and is
      # what makes exploration/tests work on the VM. The S3_* + minio service are kept (inert) for an
      # easy switch-back once the screenshot round-trip is made storage-consistent (see CLAUDE.md).
      STORAGE_BACKEND: local
      S3_BUCKET: kioskqa
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      ARCHIVE_TO_OBJECT_STORE: "true"    # mirror app_map + screenshots + plans + results → MinIO (durable S3 store)
      # --- File artifacts → /app/data, bind-mounted to the host ./data (see `volumes`) so app_map,
      # screenshots and results are VISIBLE on the VM host and PERSIST across container recreation.
      # app_map + its screenshots stay co-located (screens_dir derives from app_map_path). The cached
      # test-plans dir is not env-configurable, so it is mounted separately below.
      APP_MAP_PATH: /app/data/app_map.json
      SCREENSHOTS_DIR: /app/data/screenshots
      RESULTS_DIR: /app/data/results
      # --- Event bus → in-process (single VM). Live WebSocket updates are delivered in-process,
      # exactly like the local MVP. Switch to `redis` ONLY for multi-replica scale-out (cross-replica
      # fan-out); on one VM `memory` is simpler and has no extra moving part. ---
      EVENT_BUS_BACKEND: memory
      REDIS_URL: redis://redis:6379/0
      # --- Task queue → inline: the API runs each suite in a daemon thread (byte-identical to local).
      # The redis API/worker split is a horizontal-scale feature; on one VM it only adds a failure
      # mode (a run stuck at "pending" = the separate worker wasn't consuming the queue). ---
      TASK_QUEUE_BACKEND: inline
      # --- Tenancy / deployment ---
      MULTI_TENANT_ENABLED: "false"      # flip to true for pooled multi-customer SaaS
      DEPLOYMENT_MODE: docker
      SERVICE_ROLE: api
      # --- Auto-Repair (RAG + Claude self-healing) against the MOUNTED POS repo (see volumes) ---
      REPAIR_CODEBASE_DIR: /repos/pos              # POS source the RAG indexes + the agent edits/builds
      REPAIR_PR_BASE: expanded-cloud-agnostic      # branch a prepared fix diffs against (the deployed POS branch)
      REPAIR_PERSIST_DIR: /app/data/chroma_code_db # Chroma RAG index — under host-mounted ./data (persists + visible)
      REPAIR_AUTO_PR: "true"                       # after a green build: push the fix branch + auto-create the PR
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}              # repo-scoped PAT (from .env) → git push auth + PR creation via API
      # git identity so the agent's commit works inside the container (no repo/global config needed)
      GIT_AUTHOR_NAME: "Auto-Repair"
      GIT_AUTHOR_EMAIL: "auto-repair@kioskqa.local"
      GIT_COMMITTER_NAME: "Auto-Repair"
      GIT_COMMITTER_EMAIL: "auto-repair@kioskqa.local"
      # ── Auto-Repair RETRIEVAL + LLM backend (env-switchable; DEFAULT = Chroma + Claude) ──────────
      # These read from the HOST env with the current defaults, so a plain `docker compose up` is
      # byte-identical to before (chroma + claude). Switch stacks by setting the vars — a `.env` file
      # next to this compose, `VAR=… docker compose up`, or start-all.sh's LOCAL_REPAIR mode — with NO
      # code or compose edits and NO rework between stacks (same seam, same model plumbing). Three
      # stacks, each a one-command switch (or `LOCAL_REPAIR=<mode> ./start-all.sh`):
      #
      #   (A) DEFAULT — Chroma + Claude (cloud):   docker compose up -d      # set nothing
      #
      #   (B) LOCAL graph-RAG + Llama (Neo4j; CPU-friendly, data-sovereign):
      #         export REPAIR_RETRIEVAL_BACKEND=graphrag REPAIR_LLM_BACKEND=local \
      #                REPAIR_LOCAL_ONLY=true REPAIR_LOCAL_MODEL=llama3.2:3b
      #         docker compose --profile local-repair up -d          # starts neo4j + ollama
      #         docker compose exec ollama ollama pull llama3.2:3b
      #         curl -X POST http://localhost:8001/api/repair/index  # build the Neo4j graph-RAG index
      #      (one command:  LOCAL_REPAIR=graphrag ./start-all.sh)
      #
      #   (C) REAL Microsoft GraphRAG + Qwen (entity/community graph; best quality, GPU for big models):
      #         export INSTALL_MSGRAPHRAG=true \
      #                REPAIR_RETRIEVAL_BACKEND=msgraphrag REPAIR_LLM_BACKEND=local \
      #                REPAIR_LOCAL_ONLY=true REPAIR_LOCAL_MODEL=qwen2.5-coder:7b
      #         docker compose --profile local-repair up -d --build   # --build bakes the graphrag deps
      #         docker compose exec ollama ollama pull qwen2.5-coder:7b
      #         docker compose exec ollama ollama pull nomic-embed-text   # GraphRAG's embedding model
      #         curl -X POST http://localhost:8001/api/repair/index   # runs the Microsoft GraphRAG pipeline
      #      (one command:  LOCAL_REPAIR=msgraphrag ./start-all.sh)
      #
      # ONE MODEL: GRAPHRAG_LLM_MODEL is left empty → GraphRAG builds the graph with the SAME model that
      # DIAGNOSES the fix (REPAIR_LOCAL_MODEL). Hosts are the compose SERVICE NAMES (neo4j / ollama), not
      # localhost — the app is its own container. Verify the active stack:
      #   curl -s localhost:8001/api/health | grep -o '"repair_[a-z_]*":[^,]*'
      # TO REVERT to Chroma + Claude: unset the vars (or `docker compose up -d` in a clean shell), then
      #   curl -X POST http://localhost:8001/api/repair/index    # rebuild the index back into Chroma
      REPAIR_RETRIEVAL_BACKEND: ${REPAIR_RETRIEVAL_BACKEND:-chroma}     # chroma | graphrag | msgraphrag
      REPAIR_LLM_BACKEND: ${REPAIR_LLM_BACKEND:-claude}                 # claude | local
      REPAIR_LOCAL_ONLY: ${REPAIR_LOCAL_ONLY:-false}                    # air-gap: never fall back to Claude
      REPAIR_LOCAL_MODEL: ${REPAIR_LOCAL_MODEL:-qwen2.5-coder:14b}      # Ollama model for local diagnose + graph build
      REPAIR_LOCAL_BASE_URL: ${REPAIR_LOCAL_BASE_URL:-http://ollama:11434}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}                        # graphrag backend only
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Microsoft GraphRAG (msgraphrag backend only). GRAPHRAG_LLM_MODEL empty → same as REPAIR_LOCAL_MODEL.
      GRAPHRAG_ROOT_DIR: ${GRAPHRAG_ROOT_DIR:-/app/data/graphrag}       # workspace (persists under host ./data)
      GRAPHRAG_LLM_MODEL: ${GRAPHRAG_LLM_MODEL:-}
      GRAPHRAG_EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL:-nomic-embed-text}
      GRAPHRAG_API_BASE: ${GRAPHRAG_API_BASE:-http://ollama:11434/v1}
      GRAPHRAG_SEARCH: ${GRAPHRAG_SEARCH:-local}
      # After building the graph, ALSO load entities/relationships/community summaries into Neo4j so the
      # graph is browsable at http://<host>:7474 (bolt://…:7687). Best-effort; needs the neo4j service up.
      GRAPHRAG_EXPORT_NEO4J: ${GRAPHRAG_EXPORT_NEO4J:-true}
      # --- Auto-Repair KNOWLEDGE SOURCES: the spec/requirements/test docs indexed alongside the POS code
      # (the graph is built from these three docs + /repos/pos source). They live in the MOUNTED POS repo
      # under docs/Expanded_Version, so they travel with the app under test. Override any of them by env.
      REPAIR_DOCS_DIR: ${REPAIR_DOCS_DIR:-/repos/pos/docs/Expanded_Version}
      REPAIR_DESIGN_DOC: ${REPAIR_DESIGN_DOC:-RPS_VPS_Expanded_Design.docx}
      REPAIR_REQUIREMENTS_DOC: ${REPAIR_REQUIREMENTS_DOC:-RPS_VPS_Expanded_Requirements.docx}
      REPAIR_TEST_CASES: ${REPAIR_TEST_CASES:-RPS_VPS_Expanded_Test_Cases.xlsx}
    volumes:
      - ./data:/app/data                    # app_map.json + screenshots/ + results/  → visible on the host
      - ./data/test_plans:/app/test_plans   # cached Claude plans (path not env-configurable)
      # POS source for Auto-Repair: RAG index + patch-apply + tsc/vite build + git branch/commit.
      # rw (the agent edits + commits). Default is the VM sibling layout; override with POS_REPO_DIR.
      - ${POS_REPO_DIR:-../robotics-kiosk-pos}:/repos/pos

  # NOTE: on a single VM the API runs suites IN-PROCESS (TASK_QUEUE_BACKEND=inline above), so no
  # separate worker service is needed — this is the robust, local-identical setup. For horizontal
  # scale-out (multiple API replicas + a dedicated worker tier) on Kubernetes, set the app's
  # EVENT_BUS_BACKEND=redis and TASK_QUEUE_BACKEND=redis and add a `worker` service (same image,
  # SERVICE_ROLE=worker → `python -m worker`, same env). See deploy/k8s/ for that topology.

  # ── OPTIONAL: Auto-Repair LOCAL stack backends (Neo4j graph-RAG store + Ollama local Llama) ──────
  # Both carry `profiles: [local-repair]`, so a plain `docker compose up -d` does NOT start them —
  # the default Chroma + Claude path has no extra moving parts. Start them only when switching to a
  # local stack:  docker compose --profile local-repair up -d  (then set the REPAIR_* env on the app
  # service above — see that block — pull the model, and rebuild the index). Stop/free RAM with:
  #   docker compose --profile local-repair stop neo4j ollama
  # Ollama is shared by BOTH local stacks — the graphrag stack (Llama diagnose) and the msgraphrag
  # stack (Qwen builds the graph AND diagnoses, + the nomic-embed-text embedding model). The msgraphrag
  # stack does NOT use Neo4j (it stores its graph in the GraphRAG workspace under ./data), so neo4j just
  # idles then — harmless. Data persists in neo4jdata / ollamadata so the graph + pulled models survive.
  neo4j:
    image: neo4j:5
    profiles: ["local-repair"]
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword     # matches NEO4J_USER/NEO4J_PASSWORD in the app service
    ports: ["7474:7474", "7687:7687"]     # 7474 = Neo4j Browser UI (restrict in the firewall); 7687 = bolt
    volumes:
      - neo4jdata:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-repair"]
    ports: ["11434:11434"]                # local only; no need to open in the firewall
    volumes:
      - ollamadata:/root/.ollama          # pulled models persist here (llama3.2:3b etc.)
    restart: unless-stopped

  # Adminer — a tiny web UI to BROWSE the Postgres database in a browser: every activity's rows
  # (kiosk_configs, test_cases, test_runs, test_results, defects, app_maps, device_configs,
  # robot_events). Open  http://<VM-EXTERNAL-IP>:8081  → System: PostgreSQL · Server: postgres ·
  # Username/Password/Database: kioskqa. Open tcp:8081 in the firewall (restrict to your IP).
  adminer:
    image: adminer:latest
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  neo4jdata:      # OPTIONAL local Auto-Repair: Neo4j graph store (only used with --profile local-repair)
  ollamadata:     # OPTIONAL local Auto-Repair: pulled Ollama models (only used with --profile local-repair)
