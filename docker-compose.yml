# Cloud-agnostic local/prod stack (branch: cloud-agnostic-agent).
#
# Brings up the WHOLE agnostic topology on any Docker host — the exact managed-AWS equivalents,
# self-hosted and portable:
#   postgres  ↔ DynamoDB / RDS      (relational metadata)
#   minio     ↔ S3                  (blob / object store, S3-compatible API)
#   redis     ↔ API-GW WS + Streams (realtime event bus, cross-replica fan-out)
#   app       ↔ AgentCore Runtime + API-GW + Lambda (the FastAPI backend + agents, in-process)
#
# Run:  docker compose up --build
# The identical image + env also deploys to Kubernetes (see deploy/k8s/). Claude is unchanged —
# set ANTHROPIC_API_KEY in a .env file next to this compose file (VISION_BACKEND=anthropic).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kioskqa
      POSTGRES_PASSWORD: kioskqa
      POSTGRES_DB: kioskqa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kioskqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 = S3 API, 9001 = web console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket the app expects, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kioskqa &&
      echo 'bucket ready';
      "

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports: ["8001:8001", "6080:6080"]   # 8001 = API; 6080 = live-browser viewer (noVNC, ENABLE_VNC)
    environment:
      # --- Claude (unchanged; API key from .env) ---
      VISION_BACKEND: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Robot backend → Playwright (live Chromium for exploration + test runs) ---
      ROBOT_BACKEND: playwright
      # Live-browser viewer: ENABLE_VNC=true starts a virtual display + noVNC so you can WATCH the
      # browser at http://<EXTERNAL_IP>:6080/vnc.html during exploration + execution. It forces
      # headed Chromium. For the lightweight headless mode (no viewer), set ENABLE_VNC=false and
      # PLAYWRIGHT_HEADLESS=true.
      ENABLE_VNC: "true"
      PLAYWRIGHT_HEADLESS: "false"       # headed → renders onto the Xvfb display the viewer streams
      # --- Persistence → Postgres ---
      PERSISTENCE_BACKEND: postgres
      DB_URL: postgresql+psycopg://kioskqa:kioskqa@postgres:5432/kioskqa
      # --- Object store → LOCAL filesystem (in-container), NOT MinIO/S3. Why: the vision/explorer
      # path captures screenshots to the LOCAL fs (Playwright) then reads them back via
      # get_storage().load(); on an S3 backend that load looks in the bucket for a key that was
      # never uploaded → NoSuchKey (exploration dies in explore_screen). local = MVP-identical and is
      # what makes exploration/tests work on the VM. The S3_* + minio service are kept (inert) for an
      # easy switch-back once the screenshot round-trip is made storage-consistent (see CLAUDE.md).
      STORAGE_BACKEND: local
      S3_BUCKET: kioskqa
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      ARCHIVE_TO_OBJECT_STORE: "true"    # mirror app_map + screenshots + plans + results → MinIO (durable S3 store)
      # --- File artifacts → /app/data, bind-mounted to the host ./data (see `volumes`) so app_map,
      # screenshots and results are VISIBLE on the VM host and PERSIST across container recreation.
      # app_map + its screenshots stay co-located (screens_dir derives from app_map_path). The cached
      # test-plans dir is not env-configurable, so it is mounted separately below.
      APP_MAP_PATH: /app/data/app_map.json
      SCREENSHOTS_DIR: /app/data/screenshots
      RESULTS_DIR: /app/data/results
      # --- Event bus → in-process (single VM). Live WebSocket updates are delivered in-process,
      # exactly like the local MVP. Switch to `redis` ONLY for multi-replica scale-out (cross-replica
      # fan-out); on one VM `memory` is simpler and has no extra moving part. ---
      EVENT_BUS_BACKEND: memory
      REDIS_URL: redis://redis:6379/0
      # --- Task queue → inline: the API runs each suite in a daemon thread (byte-identical to local).
      # The redis API/worker split is a horizontal-scale feature; on one VM it only adds a failure
      # mode (a run stuck at "pending" = the separate worker wasn't consuming the queue). ---
      TASK_QUEUE_BACKEND: inline
      # --- Tenancy / deployment ---
      MULTI_TENANT_ENABLED: "false"      # flip to true for pooled multi-customer SaaS
      DEPLOYMENT_MODE: docker
      SERVICE_ROLE: api
    volumes:
      - ./data:/app/data                    # app_map.json + screenshots/ + results/  → visible on the host
      - ./data/test_plans:/app/test_plans   # cached Claude plans (path not env-configurable)

  # NOTE: on a single VM the API runs suites IN-PROCESS (TASK_QUEUE_BACKEND=inline above), so no
  # separate worker service is needed — this is the robust, local-identical setup. For horizontal
  # scale-out (multiple API replicas + a dedicated worker tier) on Kubernetes, set the app's
  # EVENT_BUS_BACKEND=redis and TASK_QUEUE_BACKEND=redis and add a `worker` service (same image,
  # SERVICE_ROLE=worker → `python -m worker`, same env). See deploy/k8s/ for that topology.

  # Adminer — a tiny web UI to BROWSE the Postgres database in a browser: every activity's rows
  # (kiosk_configs, test_cases, test_runs, test_results, defects, app_maps, device_configs,
  # robot_events). Open  http://<VM-EXTERNAL-IP>:8081  → System: PostgreSQL · Server: postgres ·
  # Username/Password/Database: kioskqa. Open tcp:8081 in the firewall (restrict to your IP).
  adminer:
    image: adminer:latest
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
